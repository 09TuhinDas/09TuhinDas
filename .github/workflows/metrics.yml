name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"     # daily at 03:00 UTC (~08:30 IST)
  workflow_dispatch:         # lets you trigger it manually from the Actions tab
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1 — header, repo/activity stats, top languages, achievements
      # Replaces: github-readme-stats (stats), github-readme-stats (top-langs), github-profile-trophy
      - name: Generate main metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: "markup, programming"
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_habits: yes
          plugin_habits_charts: yes

      # Card 2 — isometric contribution calendar
      # Replaces: github-readme-streak-stats, and looks more distinctive than a generic streak bar
      - name: Generate isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-isocalendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
